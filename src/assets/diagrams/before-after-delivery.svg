  <title id="title">Before vs managed Kinesis S3 delivery</title>
  <desc id="desc">Side-by-side north-to-south flows. Before: producers to Kinesis Data Streams to Lambda or KCL glue to S3. Now: producers to On-Demand Kinesis Data Streams to a delivery channel to an S3 general purpose bucket.</desc>
