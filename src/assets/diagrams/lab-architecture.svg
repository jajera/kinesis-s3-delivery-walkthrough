<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" role="img"
  aria-labelledby="title desc">
  <title id="title">Lab architecture — Kinesis S3 delivery</title>
  <desc id="desc">EventBridge schedules a Lambda PutRecord heartbeat by default; optional amazon-kinesis-replay also writes to an On-Demand Kinesis data stream. A delivery channel writes to an S3 general purpose bucket, with an optional DLQ error prefix.</desc>
